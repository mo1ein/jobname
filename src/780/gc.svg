<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Objects colored black (scanned), grey (being scanned), or white (not yet reached), with roots pointing into the graph and a write barrier arrow showing how a mutator's new pointer write during marking gets shaded grey.</desc>
